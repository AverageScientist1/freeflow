name: Build Freeflow

# Builds the program for Mac and Windows on GitHub's own machines (a Mac program can only be built on a Mac).
# Run it from the Actions tab ("Run workflow"), or it runs on every push. The programs appear under "Artifacts".
# On the Mac machine it also starts the program built from source and drives it once (test:desktop), so the run says
# whether the program really opens on a Mac. The programs are still built and uploaded if a test step fails.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            command: npm run dist:mac
            artifact: Freeflow-Mac
            files: |
              release/*.dmg
              release/*.zip
          - os: windows-latest
            command: npm run dist
            artifact: Freeflow-Windows
            files: |
              release/*.exe
              release/*.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Run the browser tests on the Mac (the page, the menus and the keyboard)
        if: runner.os == 'macOS'
        run: |
          npx playwright install chromium
          npx playwright test
      # GitHub's Mac machines have no graphics card (WebGL2 is unavailable there), so the plots cannot be drawn and some of these
      # tests fail for that reason alone. They are kept as information; the Mac programs are built either way.
      - name: Start the program on a Mac and drive it once (informational)
        if: runner.os == 'macOS' && !cancelled()
        continue-on-error: true
        run: npm run test:desktop
      - run: ${{ matrix.command }}
        if: ${{ !cancelled() }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # Pushing a tag such as v0.12.0 builds both programs and attaches them to a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Create the release if needed and attach the programs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Freeflow ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
